[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashbroker-cuda-tools"
version = "0.1.0"
description = "Offline-verifiable HashBroker proof-of-work and CUDA orchestration helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "eth-account>=0.13,<1",
  "eth-utils>=5,<7",
  "paramiko>=3,<4",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
