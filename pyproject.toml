[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-cuda-miner"
version = "1.0.0"
description = "Protocol-configurable CPU verification and persistent CUDA proof-of-work worker"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "eth-hash[pycryptodome]>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
universal-cuda-mine = "universal_cuda_miner.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
