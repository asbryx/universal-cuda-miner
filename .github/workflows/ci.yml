name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Public-tree scan
        run: python scripts/scan_public.py .
      - name: Offline tests
        run: python -m pytest -q
      - name: Whitespace check
        run: git diff --check
