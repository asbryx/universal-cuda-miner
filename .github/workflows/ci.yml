name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Installed import smoke
        run: python -c "import universal_cuda_miner as m; assert m.__version__ == '1.0.0'; print(m.__version__)"
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Public-tree scan
        run: python scripts/scan_public.py .
      - name: Tests
        run: python -m pytest -q
      - name: Whitespace check
        run: git diff --check

  cuda-compile:
    name: CUDA compile-only gate
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile worker without GPU execution
        run: nvcc -O2 -std=c++17 -arch=sm_75 -c cuda/universal_cuda_miner.cu -o /tmp/universal_cuda_miner.o
      - name: Verify object exists
        run: test -s /tmp/universal_cuda_miner.o
